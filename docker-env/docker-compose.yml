# Diinstansiasi dari doc-dev-backfill/templates/docker-compose.yml.template (2026-08-18), diadaptasi
# untuk migration-tool Step 6 G1 (2026-08-21), diperbarui untuk project migrasi 18.0->19.0 (2026-08-26):
# - Volume mount diarahkan ke `advanced_sales_analysis/` DI DALAM target-codebase INI
#   (`advanced-sales-analysis-migration-19`, branch `migration/19.0_target`) — G1 harus menguji kode
#   yang benar-benar dimigrasi (manifest version 19.0.1.0.0), bukan kode project 17->18 lama.
# - `name:` project di-rename `..._migration_19` supaya tidak collide dengan container project
#   17->18 (`..._migration_18`) yang mungkin masih ada di Docker Desktop dev.
# - `-d` database name di-rename `..._test_19` dengan alasan yang sama (hindari collide DB lama).
#
# Catatan penyimpangan dari template (disengaja, dicatat, masih berlaku, warisan project 17->18):
# 1. `build: .` + `shm_size` dipakai SEJAK AWAL (bukan `image: odoo:19.0` lalu diganti saat Step 07)
#    — lihat komentar di docker-env/Dockerfile.
# 2. Volume `odoo-data` untuk /var/lib/odoo ditambahkan supaya filestore ikut persist bersama
#    db-data, bukan hilang tiap container diganti.
# 3. Service `mailpit`/`greenmail` DIHAPUS — modul tidak menyentuh email sama sekali.
#
# Root repo != root addon: yang di-mount adalah SUB-FOLDER advanced_sales_analysis/, bukan root repo.
name: advanced_sales_analysis_migration_19

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8078:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/advanced-sales-analysis-migration-19/advanced_sales_analysis:/mnt/extra-addons/advanced_sales_analysis
      - odoo-data:/var/lib/odoo
      - ./logs:/var/log/odoo
    command: >
      odoo -d advanced_sales_analysis_test_19
      -i advanced_sales_analysis
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/advanced_sales_analysis
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
  odoo-data:
