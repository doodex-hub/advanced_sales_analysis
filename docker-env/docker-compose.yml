# Diinstansiasi ulang untuk project migrasi 19.0->20.0 (2026-09-24), menggantikan compose 19.0
# (masih ada di git: `git show migration/19.0:docker-env/docker-compose.yml`).
# - Odoo 20.0 FROM SOURCE (lihat Dockerfile): odoo20 (+ enterprise20) di-bind-mount read-only.
# - Mount HANYA sub-folder advanced_sales_analysis/ dari target-codebase ini (branch migration/20.0).
# - `name:`/db/port diberi suffix _20 supaya tidak bentrok dengan stack 19.0 lama
#   (advanced_sales_analysis_migration_19) atau stack pos_margin_sale_migration_20 (port 8078).
# - HOST/USER/PASSWORD env var TIDAK diterjemahkan otomatis (tidak ada entrypoint image resmi) ->
#   --db_host dst dipasang eksplisit di command.
# - --http-interface=0.0.0.0 wajib di 20.0 kalau server perlu dijangkau dari host (knowledge 19-to-20).
# - Gotcha G1: WAJIB `docker compose down -v` sebelum tiap rerun --test-enable (kalau tidak, modul
#   sudah terinstall -> instalasi & test di-skip diam-diam, "0 tests").
#
# ADDONS_PATH default = Community saja (sama seperti baseline G1 19.0 = image odoo:19.0 Community).
# Untuk run Enterprise-like: set env ASA_ADDONS_PATH=/odoo20/addons,/enterprise20,/mnt/extra-addons.
name: advanced_sales_analysis_migration_20

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'
    depends_on:
      - db
    ports:
      - "8080:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/odoo20:/odoo20:ro
      - D:/Kuncoro/doodex/repo/enterprise20:/enterprise20:ro
      - D:/Kuncoro/doodex/repo/advanced-sales-analysis-migration-20/advanced_sales_analysis:/mnt/extra-addons/advanced_sales_analysis
      - odoo-data:/var/lib/odoo
      - ./logs:/var/log/odoo
    # Mode G1 + test suite (install -> jalankan test modul -> berhenti).
    command: >
      python3 /odoo20/odoo-bin
      -d advanced_sales_analysis_test_20
      --db_host=db --db_user=odoo --db_password=odoo
      --data-dir=/var/lib/odoo
      -i advanced_sales_analysis
      --addons-path=${ASA_ADDONS_PATH:-/odoo20/addons,/mnt/extra-addons}
      --test-enable
      --test-tags=/advanced_sales_analysis
      --stop-after-init
      --http-interface=0.0.0.0
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
  odoo-data:
