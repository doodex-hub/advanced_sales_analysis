# Diinstansiasi dari doc-dev-backfill/templates/docker-compose.yml.template (2026-08-18).
#
# Catatan penyimpangan dari template (disengaja, dicatat):
# 1. `build: .` + `shm_size` dipakai SEJAK AWAL (bukan `image: odoo:17.0` lalu diganti saat Step 07)
#    — lihat komentar di docker-env/Dockerfile.
# 2. Volume `odoo-data` untuk /var/lib/odoo ditambahkan supaya filestore ikut persist bersama
#    db-data, bukan hilang tiap container diganti (akar masalah CAND-04).
# 3. Service `mailpit`/`greenmail` DIHAPUS — modul tidak menyentuh email sama sekali.
#
# Root repo != root addon: yang di-mount adalah SUB-FOLDER advanced_sales_analysis/, bukan root repo.
name: advanced_sales_analysis_backfill

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    shm_size: '2gb'
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8077:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/advanced-sales-analysis-17/advanced_sales_analysis:/mnt/extra-addons/advanced_sales_analysis
      - odoo-data:/var/lib/odoo
      - ./logs:/var/log/odoo
    command: >
      odoo -d advanced_sales_analysis_test
      -u advanced_sales_analysis
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/advanced_sales_analysis
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
  odoo-data:
